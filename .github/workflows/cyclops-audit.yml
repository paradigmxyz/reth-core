name: Cyclops audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target: # zizmor: ignore[dangerous-triggers] Publishes metadata only; never checks out PR code.
    types: [labeled, opened, synchronize, reopened, ready_for_review]
  issue_comment: # zizmor: ignore[dangerous-triggers] The command action checks caller association before publishing.
    types: [created]

permissions: {}

jobs:
  publish-label:
    if: github.event_name == 'pull_request_target' && (github.event.label.name == 'cyclops' || github.event.label.name == 'agentic-audit')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@545ea7b097e391a3a698b9d756d3263f10c7cd8b # 2026-10-20T20-48-18Z-545ea7b0
      - name: Publish event
        env:
          EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
          EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
          EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          [[ -n "$EVENTS_ARGS" ]] || { echo "::error::Missing EVENTS_ARGS secret"; exit 1; }
          [[ -n "$EVENTS_KEY" ]] || { echo "::error::Missing EVENTS_KEY secret"; exit 1; }
          [[ -n "$EVENTS_CERT" ]] || { echo "::error::Missing EVENTS_CERT secret"; exit 1; }

          printf '%s' "$EVENTS_KEY" > "$RUNNER_TEMP/key"
          printf '%s' "$EVENTS_CERT" > "$RUNNER_TEMP/cert"

          events_args=()
          while IFS= read -r -d '' arg; do
            events_args+=("$arg")
          done < <(
            env -i PATH="$PATH" python3 -I -S -c '
          import shlex
          import sys

          for arg in shlex.split(sys.stdin.read()):
              sys.stdout.buffer.write(arg.encode() + b"\0")
          ' <<< "$EVENTS_ARGS"
          )
          (( ${#events_args[@]} > 0 )) || { echo "::error::Empty EVENTS_ARGS"; exit 1; }

          jq -n --arg repo "$REPO" --arg sha "$PR_HEAD_SHA" --argjson pr "$PR_NUMBER" \
            '{repository: $repo, event: "pr_audit", data: {pr_number: $pr, sha: $sha}}' \
          | env -i PATH="$PATH" curl -sf -o /dev/null -X POST "${events_args[@]}" \
              --write-out '\nCyclops event HTTP status: %{http_code}\n' \
              -H "Content-Type: application/json" \
              --key "$RUNNER_TEMP/key" --cert "$RUNNER_TEMP/cert" -d @-

  # Automatic reviews apply only to same-repository PRs; labels can review forks.
  audit:
    if: >-
      contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) &&
      github.event.action != 'labeled' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      statuses: write
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@545ea7b097e391a3a698b9d756d3263f10c7cd8b # 2026-10-20T20-48-18Z-545ea7b0
    with:
      audit-on-push: true
      audit-on-command: true
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: >-
        ${{ secrets.EVENTS_ARGS }} --write-out '\nCyclops event HTTP status: %{http_code}\n'

  publish-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, 'cyclops audit') ||
        startsWith(github.event.comment.body, 'cyclops private audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops audit') ||
        startsWith(github.event.comment.body, '@decofe cyclops private audit') ||
        startsWith(github.event.comment.body, 'derek audit')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@545ea7b097e391a3a698b9d756d3263f10c7cd8b # 2026-10-20T20-48-18Z-545ea7b0
      - name: Handle audit command
        uses: tempoxyz/gh-actions/actions/pr-audit-comment@545ea7b097e391a3a698b9d756d3263f10c7cd8b # 2026-10-20T20-48-18Z-545ea7b0
        with:
          command-regex: '^(?:@decofe\s+)?(?:cyclops\s+(?:private\s+)?audit|derek\s+audit)\b'
          permission-check-mode: association
          allowed-associations: OWNER,MEMBER,COLLABORATOR
          organization: paradigmxyz
          events-key: ${{ secrets.EVENTS_KEY }}
          events-cert: ${{ secrets.EVENTS_CERT }}
          events-args: >-
            ${{ secrets.EVENTS_ARGS }} --write-out '\nCyclops event HTTP status: %{http_code}\n'
          github-token: ${{ github.token }}
